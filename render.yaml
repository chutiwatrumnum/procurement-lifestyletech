services:
  - type: web
    name: procurement-pocketbase
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: main
    healthCheckPath: /api/health
    disk:
      name: pb-data
      mountPath: /pb/pb_data
      sizeGB: 1
    envVars:
      # Render asks for this value when the Blueprint is created. Leave it empty to turn LINE messages off.
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
